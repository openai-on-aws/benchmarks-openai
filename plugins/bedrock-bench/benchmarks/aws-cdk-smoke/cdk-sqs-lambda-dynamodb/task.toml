schema_version = "1.4"
artifacts = [
  { source = "/app/lib/stack.ts", destination = "stack.ts" },
  { source = "/app/lambda/handler.js", destination = "handler.js" },
]

[metadata]
author_name = "OpenAI on AWS"
difficulty = "easy"
category = "software-engineering"
tags = ["aws", "cdk", "typescript", "lambda", "sqs", "dynamodb"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
