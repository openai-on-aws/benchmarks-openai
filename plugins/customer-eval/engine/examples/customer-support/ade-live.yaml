schema_version: 0.1.0
experiment:
  id: ade_sol_migration
  title: 'ADE: GPT-5.6 Sol to GPT-6.1 Sol - synthetic support qualification'
  objective: Complete the customer task while preserving the supplied policy.
  decision: Compare two model configurations under the same Codex agent and starting
    prompt.
  owner: Workshop participant
models:
- id: m1
  provider: amazon_bedrock
  model_id: us.openai.gpt-5.6-sol
  model_id_env: null
  api: responses
  endpoint_env: EVAL_BEDROCK_BASE_URL
  region: us-east-1
  credential_ref: aws_profile:YOUR_AWS_PROFILE
  parameters:
    reasoning:
      effort: low
  compatibility: unverified
  verification_ref: null
- id: m2
  provider: amazon_bedrock
  model_id: us.openai.gpt-6.1-sol
  model_id_env: null
  api: responses
  endpoint_env: EVAL_BEDROCK_BASE_URL
  region: us-east-1
  credential_ref: aws_profile:YOUR_AWS_PROFILE
  parameters:
    reasoning:
      effort: low
  compatibility: unverified
  verification_ref: null
- id: optimizer
  provider: amazon_bedrock
  model_id: us.openai.gpt-6.1-sol
  model_id_env: null
  api: responses
  endpoint_env: EVAL_BEDROCK_BASE_URL
  region: us-east-1
  credential_ref: aws_profile:YOUR_AWS_PROFILE
  parameters:
    reasoning:
      effort: low
  compatibility: unverified
  verification_ref: null
prompts:
- id: p1
  path: prompts/p1.txt
  version: '1'
  variables: []
agents:
- id: support_agent
  description: Read the supplied policy and answer the customer question.
  harness: codex
  harness_version: null
  workspace: null
  instructions_path: policy.txt
  runtime: local
  runtime_ref: null
  gateway_id: null
  tool_allowlist:
  - lookup_order
  sandbox: read_only
  side_effects: mocked
  codex_profile: null
gateways: []
variants:
- id: m1_p1
  model_id: m1
  prompt_id: p1
  agent_id: support_agent
  route: direct_model_api
  gateway_id: null
- id: m2_p1
  model_id: m2
  prompt_id: p1
  agent_id: support_agent
  route: direct_model_api
  gateway_id: null
baseline_variant_id: m1_p1
datasets:
- id: development
  path: data/development.jsonl
  format: jsonl
  version: '1'
  split: development
  provenance: synthetic
  label_status: unreviewed
- id: validation
  path: data/validation.jsonl
  format: jsonl
  version: '1'
  split: validation
  provenance: synthetic
  label_status: unreviewed
- id: holdout
  path: data/holdout.jsonl
  format: jsonl
  version: '1'
  split: holdout
  provenance: synthetic
  label_status: unreviewed
checks:
- id: correctness
  question: Does the response satisfy the expected result?
  method: deterministic
  implementation_ref: grading.json
  judge_model_id: null
  calibration_ref: null
  required: true
success_criteria:
- id: quality
  metric: all_required_checks_pass_rate
  check_id: null
  definition: All required checks pass / all planned trials, including failed trials.
  operator: '>='
  threshold: 1.0
  status: confirmed
  confirmed_by: Synthetic demo design; replace for customer use
execution:
  repetitions: 1
  max_cases_per_dataset: 2
  concurrency: 2
  timeout_seconds: 180
  budget_usd: null
  fallback_policy: none
optimization:
  enabled: true
  target_prompt_id: p1
  development_dataset_ids:
  - development
  holdout_dataset_ids:
  - holdout
  max_iterations: 1
  objective_criterion_id: quality
open_questions: []
evidence:
- field: /
  source: Illustrative synthetic example authored for framework validation; not a
    customer commitment.
  status: proposed
- field: runner.budget_policy
  source: Historical example settings; replace with the recipient's approved profile, models and budget
    on 2026-10-28. Iteration, request, concurrency and time bounds still apply.
  status: user_confirmed
runner:
  mode: agent
  workload: customer_support
  source_variant_id: m1_p1
  target_variant_id: m2_p1
  validation_dataset_ids:
  - validation
  protected_instructions_path: policy.txt
  grading_path: grading.json
  optimizer_model_id: optimizer
  candidates_per_generation: 1
  min_gain: 0.01
  max_turns: 3
  routes:
    m1:
      auth: sigv4
      sigv4_service: bedrock
      input_usd_per_million: null
      output_usd_per_million: null
      pricing_source: Pricing not yet collected. User explicitly requested no dollar
        limit; monetary costs remain unknown.
    m2:
      auth: sigv4
      sigv4_service: bedrock
      input_usd_per_million: null
      output_usd_per_million: null
      pricing_source: Pricing not yet collected. User explicitly requested no dollar
        limit; monetary costs remain unknown.
    optimizer:
      auth: sigv4
      sigv4_service: bedrock
      input_usd_per_million: null
      output_usd_per_million: null
      pricing_source: Pricing not yet collected. User explicitly requested no dollar
        limit; monetary costs remain unknown.
  limits:
    max_requests: 6
    max_output_tokens: 2048
    max_request_bytes: 80000
  budget_policy: unlimited
