<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title description">
  <title id="title">Benchmark workflow</title>
  <desc id="description">Choose Amazon Bedrock, using Mantle or Runtime, or the OpenAI API. Run Bedrock Bench or API suites. Compare success, latency, and cost using saved evidence and reports.</desc>
  <!-- Transparent canvas. Keep layout and content aligned with the other theme variant. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .heading { fill: #e6edf3; font-size: 21px; font-weight: 600; }
    .body { fill: #e6edf3; font-size: 17px; font-weight: 500; }
    .detail { fill: #9da7b3; font-size: 14px; }
    .footer { fill: #9da7b3; font-size: 13px; }
    .metric { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .connector { fill: none; stroke: #7d8590; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#7d8590" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="12" y="16" width="280" height="192" rx="14" class="card"/>
  <text x="32" y="50" class="heading">Choose targets</text>
  <path d="M32 63h24" stroke="#f0883e" stroke-width="3" stroke-linecap="round"/>
  <text x="32" y="92" class="body">Amazon Bedrock</text>
  <text x="32" y="114" class="detail">Mantle · Runtime</text>
  <text x="32" y="151" class="body">OpenAI API · 1P</text>
  <text x="32" y="188" class="footer">Models · regions · settings</text>
  <path d="M302 112h26" class="connector"/>
  <rect x="340" y="16" width="280" height="192" rx="14" class="card"/>
  <text x="360" y="50" class="heading">Run a benchmark</text>
  <path d="M360 63h24" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="92" class="body">Bedrock Bench</text>
  <text x="360" y="114" class="detail">Chat or CLI</text>
  <text x="360" y="151" class="body">API suites</text>
  <text x="360" y="188" class="footer">Tasks · runner · limits</text>
  <path d="M630 112h26" class="connector"/>
  <rect x="668" y="16" width="280" height="192" rx="14" class="card"/>
  <text x="688" y="50" class="heading">Compare results</text>
  <path d="M688 63h24" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <rect x="688" y="83" width="80" height="30" rx="15" fill="#142d20"/>
  <text x="728" y="103" class="metric" fill="#7ee787">Success</text>
  <rect x="776" y="83" width="84" height="30" rx="15" fill="#142b43"/>
  <text x="818" y="103" class="metric" fill="#a5d6ff">Latency</text>
  <rect x="868" y="83" width="60" height="30" rx="15" fill="#332815"/>
  <text x="898" y="103" class="metric" fill="#f2cc60">Cost</text>
  <text x="688" y="151" class="body">Saved evidence + reports</text>
  <text x="688" y="188" class="footer">Tokens · traces · scores</text>
</svg>
