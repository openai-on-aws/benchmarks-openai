name: Offline benchmark checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/benchmark-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-arc.txt
      - run: python -m pip install -r requirements-arc.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s comparisons/gpt-4.1-vs-gpt-5.6 -p 'test_*.py'
      - run: python -B comparisons/gpt-4.1-vs-gpt-5.6/render_report.py --verify
