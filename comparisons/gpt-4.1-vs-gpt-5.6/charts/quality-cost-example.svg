   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253242" x="40.176" y="462.528" transform="rotate(-0 40.176 462.528)">Points use metered spend; horizontal bars extend to the conservative upper estimate for missing usage, not a confidence interval.</text>
